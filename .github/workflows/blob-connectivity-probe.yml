name: Blob connectivity probe

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Production endpoint
        shell: bash
        env:
          BASE_URL: https://response-tool-i1cn2ogqr-an-nons-projects.vercel.app
        run: |
          set -euo pipefail
          curl -sS -L -D headers.txt -o body.txt -w 'http_code=%{http_code}\ncontent_type=%{content_type}\nurl_effective=%{url_effective}\n' "$BASE_URL/api/health" | tee probe.txt
          echo '--- selected headers ---'
          grep -Ei '^(HTTP/|content-type:|location:|server:|x-vercel-id:)' headers.txt || true
          echo '--- first body line ---'
          head -n 1 body.txt | cut -c1-200

          if jq -e '.ok == true' body.txt >/dev/null 2>&1; then
            echo 'health_json=true'
            jq -r '"blob_store_id_present=" + ((.vault.store_id_present // false)|tostring)' body.txt
          else
            echo 'health_json=false'
            exit 2
          fi
