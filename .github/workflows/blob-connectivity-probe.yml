name: Response Tool app probe

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify minimal UI and live AI response
        shell: bash
        env:
          BASE_URL: https://response-tool.vercel.app
        run: |
          set -euo pipefail

          ROOT_CODE=$(curl -sS -o index.html -w '%{http_code}' "$BASE_URL/")
          echo "root_http_code=$ROOT_CODE"
          test "$ROOT_CODE" = "200"
          grep -q 'id="input"' index.html
          grep -q 'id="send"' index.html
          grep -q 'id="response"' index.html
          echo "minimal_ui_ok=true"

          HEALTH_CODE=$(curl -sS -o health.json -w '%{http_code}' "$BASE_URL/api/health")
          echo "health_http_code=$HEALTH_CODE"
          test "$HEALTH_CODE" = "200"
          GROQ_CONFIGURED=$(jq -r '.groq_configured' health.json)
          BLOB_PRESENT=$(jq -r '.vault.store_id_present' health.json)
          echo "groq_configured=$GROQ_CONFIGURED"
          echo "blob_store_id_present=$BLOB_PRESENT"

          cat > payload.json <<'JSON'
          {
            "schema_version":"1.3",
            "request_id":"web_app_probe",
            "request_text":"Reply exactly with the single word OK.",
            "yuki_state":{"intent":"affirmative","consent":"affirmative_revocable","initiative":"neutral","affection":"neutral","arousal_context":"none","plain_language":""},
            "yuki_context":{"profile_id":"response-tool-web-probe","persona":{"autonomy":"independent"},"consent_profile":{"revocable":true,"current_permissions":[]},"relationship":{"established":false,"mode":null}},
            "state_transition":{"action":"preserve","reason":"web_app_probe"},
            "rendering":{"language":"en","max_output_tokens":8,"output_format":"text"}
          }
          JSON

          RELAY_CODE=$(curl -sS -o relay.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @payload.json "$BASE_URL/api/relay")
          echo "relay_http_code=$RELAY_CODE"
          jq -c '{ok,error,result_type,provider,model,text,execution,vault}' relay.json

          test "$GROQ_CONFIGURED" = "true"
          test "$RELAY_CODE" = "200"
          jq -e '.ok == true and .result_type == "generated_text" and .provider == "groq" and (.text|type == "string") and (.text|length > 0)' relay.json >/dev/null
          echo "ai_generated=true"
          printf 'ai_text=%s\n' "$(jq -r '.text' relay.json)"
