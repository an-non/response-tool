name: Response Tool persistent session probe

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production persistent session resume
        shell: bash
        env:
          BASE_URL: https://response-tool.vercel.app
        run: |
          set -euo pipefail

          ROOT_CODE=$(curl -sS -o index.html -w '%{http_code}' "$BASE_URL/")
          echo "root_http_code=$ROOT_CODE"
          test "$ROOT_CODE" = "200"
          grep -q "client_id" index.html
          grep -q "/api/history" index.html
          echo "persistent_resume_ui_present=true"

          HEALTH_CODE=$(curl -sS -o memory-health.json -w '%{http_code}' "$BASE_URL/api/memory-health")
          echo "memory_health_http_code=$HEALTH_CODE"
          test "$HEALTH_CODE" = "200"
          jq -e '.ok == true and .memory.provider == "vercel_private_blob"' memory-health.json >/dev/null
          echo "blob_memory_health_ok=true"

          PROFILE="response-tool-session-resume-probe"
          SESSION="resume-probe-$(date +%s)"
          CLIENT_ID="client-resume-probe-$(date +%s)"
          CLIENT_KEY="probe-key-$(date +%s)-$RANDOM-$RANDOM"
          MARKER="RESUME_MARKER_$(date +%s)"

          jq -n \
            --arg rid "session_resume_probe" \
            --arg text "Remember $MARKER and reply exactly OK." \
            --arg profile "$PROFILE" \
            --arg session "$SESSION" \
            --arg client_id "$CLIENT_ID" \
            --arg client_key "$CLIENT_KEY" \
            '{schema_version:"1.3",request_id:$rid,request_text:$text,session_id:$session,client_id:$client_id,client_key:$client_key,client_recent_turns:[],yuki_state:{intent:"affirmative",consent:"affirmative_revocable",initiative:"neutral",affection:"neutral",arousal_context:"none",plain_language:""},yuki_context:{profile_id:$profile,session_id:$session,persona:{autonomy:"independent"},consent_profile:{revocable:true,current_permissions:[]},relationship:{established:false,mode:null}},state_transition:{action:"preserve",reason:"session_resume_probe"},rendering:{language:"en",max_output_tokens:24,output_format:"text"}}' > payload.json
          P=$(base64 -w0 payload.json | tr '+/' '-_' | tr -d '=')
          RELAY_CODE=$(curl -sS -o relay.json -w '%{http_code}' "$BASE_URL/api/relay?p=$P")
          echo "relay_http_code=$RELAY_CODE"
          jq -c '{ok,error,http_status,retry_after_seconds,trace_id,memory}' relay.json
          if [ "$RELAY_CODE" = "429" ]; then
            echo "groq_rate_limit_blocked_probe=true"
            exit 2
          fi
          test "$RELAY_CODE" = "200"
          jq -e '.ok == true and .memory.blob_configured == true' relay.json >/dev/null

          for TRY in $(seq 1 12); do
            RESUME_CODE=$(curl -sS -o resume.json -w '%{http_code}' "$BASE_URL/api/history?profile_id=$PROFILE&client_id=$CLIENT_ID&client_key=$CLIENT_KEY&limit=30")
            echo "resume_try_${TRY}_http_code=$RESUME_CODE"
            if [ "$RESUME_CODE" = "200" ]; then
              BREAK_SESSION=$(jq -r '.session_id // ""' resume.json)
              TURN_COUNT=$(jq '.turns | length' resume.json)
              if [ "$BREAK_SESSION" = "$SESSION" ] && [ "$TURN_COUNT" -ge 1 ]; then break; fi
            fi
            sleep 2
          done

          jq -c '{ok,session_id,turn_count:(.turns|length),updated_at}' resume.json
          test "$RESUME_CODE" = "200"
          jq -e --arg session "$SESSION" --arg marker "$MARKER" '.ok == true and .session_id == $session and (.turns|length) >= 1 and ([.turns[].request_text] | any(contains($marker)))' resume.json >/dev/null
          echo "same_session_restored=true"
          echo "history_restored=true"
          echo "persistent_session_resume_ok=true"
