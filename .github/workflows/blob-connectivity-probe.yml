name: Inspect Response Tool memory v2

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read existing isolated production memory
        shell: bash
        env:
          BASE_URL: https://response-tool.vercel.app
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['BASE_URL']
          params=urllib.parse.urlencode({
            'profile_id':'memory-v2-probe-31887513022-5',
            'client_id':'client-31887513022-5',
            'client_key':'key-31887513022-5-not-a-secret',
            'limit':'30',
            'include_memory':'1'
          })
          with urllib.request.urlopen(base+'/api/history?'+params, timeout=60) as r:
            body=json.loads(r.read().decode())
          print('MANIFEST', json.dumps(body.get('memory_manifest'), ensure_ascii=False), flush=True)
          d=body.get('memory_diagnostics') or {}
          print('CURRENT', json.dumps(d.get('current_memory'), ensure_ascii=False), flush=True)
          print('BLOCKS', json.dumps(d.get('recent_block_statuses'), ensure_ascii=False), flush=True)
          print('TURNS', [t.get('turn_no') for t in body.get('turns') or []], flush=True)
          PY
