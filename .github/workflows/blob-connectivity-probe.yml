name: Blob connectivity probe

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Production Blob write and read-back
        shell: bash
        env:
          BASE_URL: https://response-tool.vercel.app
        run: |
          set -euo pipefail

          HEALTH_CODE=$(curl -sS -o health.json -w '%{http_code}' "$BASE_URL/api/health")
          echo "health_http_code=$HEALTH_CODE"
          jq -e '.ok == true' health.json >/dev/null
          STORE_PRESENT=$(jq -r '.vault.store_id_present' health.json)
          echo "blob_store_id_present=$STORE_PRESENT"
          test "$STORE_PRESENT" = "true"

          P=$(python3 - <<'PY'
          import base64, json, os
          run_id = os.environ.get('GITHUB_RUN_ID', 'unknown')
          payload = {
              'schema_version': '1.3',
              'request_id': f'blob_probe_{run_id}',
              'request_text': 'Blob connectivity probe. Reply exactly OK.',
              'yuki_state': {
                  'intent': 'affirmative',
                  'consent': 'affirmative_revocable',
                  'initiative': 'neutral',
                  'affection': 'medium',
                  'arousal_context': 'none'
              },
              'yuki_context': {
                  'profile_id': f'blob-probe-{run_id}',
                  'persona': {'autonomy': 'independent'},
                  'consent_profile': {'revocable': True, 'current_permissions': []},
                  'relationship': {'established': False, 'mode': None}
              },
              'state_transition': {'action': 'preserve', 'reason': 'connectivity_probe'},
              'rendering': {'language': 'en', 'max_output_tokens': 2, 'output_format': 'text'}
          }
          raw = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode()
          print(base64.urlsafe_b64encode(raw).decode().rstrip('='))
          PY
          )

          RELAY_CODE=$(curl -sS -o relay.json -w '%{http_code}' --get --data-urlencode "p=$P" "$BASE_URL/api/relay")
          echo "relay_http_code=$RELAY_CODE"
          jq -e '.trace_id and .vault' relay.json >/dev/null
          TRACE_ID=$(jq -r '.trace_id' relay.json)
          BACKEND=$(jq -r '.vault.backend // empty' relay.json)
          echo "trace_id=$TRACE_ID"
          echo "vault_backend=$BACKEND"
          if [ "$BACKEND" != "vercel_private_blob" ]; then
            jq -r '"blob_attempt_error=" + (.vault.blob_attempt_error // "none")' relay.json
            exit 1
          fi

          REQUEST_URL=$(jq -r '.vault.request_url' relay.json)
          META_URL=$(jq -r '.vault.metadata_url' relay.json)
          LIST_URL=$(jq -r '.vault.list_url' relay.json)

          curl -sS "$REQUEST_URL" -o request.txt
          test "$(cat request.txt)" = 'Blob connectivity probe. Reply exactly OK.'
          echo "request_readback_ok=true"

          curl -sS "$META_URL" -o metadata.json
          jq -e '.ok == true and .metadata.trace_id == $trace' --arg trace "$TRACE_ID" metadata.json >/dev/null
          echo "metadata_readback_ok=true"

          curl -sS "$LIST_URL" -o list.json
          jq -e '.ok == true and .backend == "vercel_private_blob"' list.json >/dev/null
          COUNT=$(jq --arg trace "$TRACE_ID" '[.blobs[] | select(.pathname | contains($trace))] | length' list.json)
          echo "blob_objects_for_trace=$COUNT"
          test "$COUNT" -ge 2
          echo "blob_list_contains_trace=true"
