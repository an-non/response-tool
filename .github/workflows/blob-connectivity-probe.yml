name: Verify Response Tool natural-language memory behavior

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exercise save wording recall and approval memory
        shell: bash
        env:
          BASE_URL: https://response-tool.vercel.app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request

          base=os.environ['BASE_URL']
          run=os.environ['GITHUB_RUN_ID']
          attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
          profile=f'natural-memory-probe-{run}-{attempt}'
          session=f'session-{run}-{attempt}'
          client_id=f'client-{run}-{attempt}'
          client_key=f'key-{run}-{attempt}-isolated'
          token=None
          responses=[]
          latencies=[]
          checkpoints={}

          def get_json(url, timeout=90):
              req=urllib.request.Request(url, headers={'User-Agent':'response-tool-natural-memory-probe/1.0'})
              started=time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read().decode()), time.monotonic()-started
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except Exception: body={'raw':raw}
                  return e.code, body, time.monotonic()-started

          def enc(obj):
              raw=json.dumps(obj,ensure_ascii=False,separators=(',',':')).encode()
              return base64.urlsafe_b64encode(raw).decode().rstrip('=')

          def history():
              q=urllib.parse.urlencode({'profile_id':profile,'client_id':client_id,'client_key':client_key,'limit':'40','include_memory':'1'})
              return get_json(base+'/api/history?'+q)

          def wait_memory(min_turns,min_ready,min_through,timeout=100):
              deadline=time.monotonic()+timeout
              last=None
              while time.monotonic()<deadline:
                  status,body,_=history(); last=(status,body)
                  m=(body.get('memory_manifest') or {}) if status==200 else {}
                  if status==200 and len(body.get('turns') or [])>=min_turns and m.get('ready_block_count',0)>=min_ready and m.get('current_memory_available') is True and m.get('current_memory_included_through_turn',0)>=min_through:
                      return body
                  time.sleep(2)
              raise RuntimeError('memory checkpoint failed: '+repr(last))

          def send(n,text):
              payload={
                'schema_version':'1.3','request_id':f'natural_{n:02d}','request_text':text,
                'session_id':session,'session_token':token or '',
                'client_id':client_id,'client_key':client_key,'client_recent_turns':[],
                'yuki_state':{'intent':'neutral','consent':'neutral','initiative':'neutral','affection':'neutral','arousal_context':'none','plain_language':''},
                'yuki_context':{'profile_id':profile,'session_id':session,'persona':{'autonomy':'independent'},'consent_profile':{'revocable':True,'current_permissions':[]},'relationship':{'established':False,'mode':None}},
                'state_transition':{'action':'preserve','reason':'natural_memory_probe'},
                'rendering':{'language':'ja','max_output_tokens':120,'output_format':'text'}
              }
              url=base+'/api/relay?p='+urllib.parse.quote(enc(payload),safe='')
              last=None
              for retry in range(1,7):
                  status,body,elapsed=get_json(url); last=(status,body,elapsed)
                  if status==200 and body.get('ok') is True: return body,elapsed
                  if status==429 or body.get('error')=='groq_rate_limit':
                      try: delay=max(8,min(35,int(body.get('retry_after_seconds'))))
                      except Exception: delay=15
                      print('RATE_LIMIT',n,retry,delay,flush=True); time.sleep(delay); continue
                  raise RuntimeError(f'turn {n} failed: {last}')
              raise RuntimeError(f'turn {n} exhausted: {last}')

          hs,hb,_=get_json(base+'/api/memory-health')
          assert hs==200 and hb.get('ok') is True
          assert hb.get('compression_block_size')==3 and hb.get('memory_schema')=='v2'

          prompts=[
            '作業メモです。基準語Aは「琥珀の鍵」です。保存して。',
            '作業メモです。基準語Bは「銀の方位磁針」です。これは今の会話の文脈です。',
            '判断基準は「推測より実測」です。これも覚えておいて。',
            '承認の現在状態は、行為については何も許可していません。過去の承認は現在の許可ではありません。',
            '承認しているのは、過去の文脈を参照してよいことだけです。',
            'だから「どこまで承認した？」への答えは、文脈参照のみで、現在の行為許可はなしです。',
            '今日は記憶の仕組みを確認しています。',
            '原文と索引を分けて扱うのが大切です。',
            '重要度は意味に応じて決めればよく、命令語だけで決めなくてよいと思います。',
            '最初の方で、保存してと言った基準語と、保存してとは言わなかった基準語はそれぞれ何？ 判断基準も答えて。',
            'どこまで承認した？'
          ]

          for n,prompt in enumerate(prompts,1):
              body,elapsed=send(n,prompt)
              token=body.get('memory',{}).get('session_token') or token
              responses.append(body.get('text','')); latencies.append(elapsed)
              print('TURN',n,'LATENCY',round(elapsed,3),'SOURCE',body.get('memory',{}).get('source'),'RECALL',body.get('memory',{}).get('recall_matches'),flush=True)
              print('USER',prompt,flush=True)
              print('YUKI',body.get('text',''),flush=True)
              assert elapsed < 40
              if n in (3,6,9):
                  cp=wait_memory(n,n//3,n)
                  checkpoints[n]=cp
                  d=cp.get('memory_diagnostics') or {}
                  ready=[b for b in d.get('recent_block_statuses') or [] if b.get('status')=='ready']
                  assert len(ready)>=n//3
                  print('CHECKPOINT',n,'MANIFEST',json.dumps(cp.get('memory_manifest'),ensure_ascii=False),flush=True)
                  print('CHECKPOINT',n,'BLOCKS',json.dumps(ready,ensure_ascii=False),flush=True)
              time.sleep(8)

          assert '琥珀の鍵' in responses[9]
          assert '銀の方位磁針' in responses[9]
          assert '推測より実測' in responses[9]
          assert '文脈' in responses[10]

          final_history=wait_memory(11,3,9)
          fm=final_history['memory_manifest']
          assert len(final_history.get('turns') or [])>=11
          assert fm.get('ready_block_count',0)>=3
          assert fm.get('error_block_count',0)==0 and fm.get('pending_block_count',0)==0

          def recall(q):
              params=urllib.parse.urlencode({'profile_id':profile,'session_id':session,'token':token,'q':q,'max_blocks':'3'})
              status,body,_=get_json(base+'/api/recall?'+params)
              assert status==200 and body.get('ok') is True
              return body.get('recall') or {}

          recall_save=recall('琥珀の鍵 保存して')
          recall_approval=recall('どこまで承認した 文脈参照 行為許可')
          assert any(x.get('turn_no')==1 and '琥珀の鍵' in x.get('request','') for x in recall_save.get('matches') or [])
          assert any(x.get('turn_no') in (4,5,6) for x in recall_approval.get('matches') or [])

          block1=next(b for b in (checkpoints[3].get('memory_diagnostics') or {}).get('recent_block_statuses') or [] if b.get('block_no')==1)
          block2=next(b for b in (checkpoints[6].get('memory_diagnostics') or {}).get('recent_block_statuses') or [] if b.get('block_no')==2)
          result={
            'ok':True,
            'profile_id':profile,
            'turn_count':len(final_history.get('turns') or []),
            'ready_block_count':fm.get('ready_block_count'),
            'turn10_answer':responses[9],
            'turn11_answer':responses[10],
            'block1':block1,
            'block2':block2,
            'save_recall_matched_turns':[x.get('turn_no') for x in recall_save.get('matches') or []],
            'approval_recall_matched_turns':[x.get('turn_no') for x in recall_approval.get('matches') or []],
            'average_latency_seconds':round(sum(latencies)/len(latencies),3),
            'max_latency_seconds':round(max(latencies),3)
          }
          print('NATURAL_MEMORY_RESULT',json.dumps(result,ensure_ascii=False),flush=True)
          with open('natural-memory-result.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          PY

      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: natural-memory-production-check
          path: natural-memory-result.json
          if-no-files-found: error
