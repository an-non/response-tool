name: One-rally Yuki continuity check

on:
  push:
    branches:
      - blob-connectivity-probe-20260812

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send exactly one relay turn to an existing session
        shell: bash
        env:
          BASE_URL: https://response-tool.vercel.app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request, urllib.error

          base=os.environ['BASE_URL']
          profile='natural-memory-probe-31892023845-1'
          session='session-31892023845-1'
          client_id='client-31892023845-1'
          client_key='key-31892023845-1-isolated'
          prompt='前に話した基準語AとB、判断基準を短く教えて。説明は一文で。'

          payload={
            'schema_version':'1.3','request_id':'one_rally_continuity_check','request_text':prompt,
            'session_id':session,'client_id':client_id,'client_key':client_key,'client_recent_turns':[],
            'yuki_state':{'intent':'neutral','consent':'neutral','initiative':'neutral','affection':'neutral','arousal_context':'none','plain_language':''},
            'yuki_context':{'profile_id':profile,'session_id':session,'persona':{'autonomy':'independent'},'consent_profile':{'revocable':True,'current_permissions':[]},'relationship':{'established':False,'mode':None}},
            'state_transition':{'action':'preserve','reason':'one_rally_continuity_check'},
            'rendering':{'language':'ja','max_output_tokens':160,'output_format':'text'}
          }
          raw=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode()
          p=base64.urlsafe_b64encode(raw).decode().rstrip('=')
          url=base+'/api/relay?p='+urllib.parse.quote(p,safe='')
          req=urllib.request.Request(url,headers={'User-Agent':'response-tool-one-rally-check/1.0'})
          started=time.monotonic()
          try:
            with urllib.request.urlopen(req,timeout=90) as r:
              status=r.status; body=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
            status=e.code; body=json.loads(e.read().decode('utf-8','replace'))
          elapsed=time.monotonic()-started
          print('HTTP',status)
          print('LATENCY',round(elapsed,3))
          print('USER',prompt)
          print('YUKI',body.get('text',''))
          print('MEMORY',json.dumps(body.get('memory') or {},ensure_ascii=False))
          if status != 200 or body.get('ok') is not True:
            raise SystemExit('relay failed: '+json.dumps(body,ensure_ascii=False))
          mem=body.get('memory') or {}
          manifest=mem.get('manifest') or {}
          if mem.get('session_id') != session:
            raise SystemExit('session mismatch')
          if int(manifest.get('turn_count') or 0) < 11:
            raise SystemExit('existing history not loaded')
          if mem.get('source') not in ('current','legacy_v1_current','latest_ready_block_fallback','latest_degraded_block_fallback'):
            raise SystemExit('continuity memory not loaded')
          text=body.get('text','')
          expected=('琥珀の鍵','銀の方位磁針','推測より実測')
          if not all(value in text for value in expected):
            raise SystemExit('Yuki did not recall expected continuity facts')
          print('ONE_RALLY_OK=true')
          PY
