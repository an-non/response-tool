<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ox Alpha Chat | Response Tool</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f6f7f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px}main{width:min(920px,100%);margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#666;margin-top:3px}.back,.secondary{display:inline-flex;align-items:center;text-decoration:none;color:#222;border:1px solid #ccc;border-radius:9px;padding:8px 10px;background:#fff;font:inherit;cursor:pointer}
    #health{font-size:12px;line-height:1.5;padding:9px 11px;border:1px solid #ddd;border-radius:10px;background:#fafafa;margin-bottom:14px}.health-ok{color:#146c2e}.health-bad{color:#a11}
    #conversation{display:grid;gap:12px;margin:12px 0 18px;max-height:56vh;overflow:auto}.turn{white-space:pre-wrap;line-height:1.6;padding:12px 14px;border-radius:12px;background:#f5f5f5}.assistant{background:#eef1f4}.meta{font-size:11px;color:#777;margin-top:7px}.file-chip{font-size:12px;border:1px solid #ccc;border-radius:999px;padding:5px 8px;background:#fff}.file-chip button{border:0;background:transparent;padding:0 0 0 5px;color:#777;cursor:pointer}
    .artifacts{display:grid;gap:8px;margin-top:10px}.artifact-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #cfd5dc;border-radius:10px;padding:9px 11px;background:#fff;white-space:normal}.artifact-info{min-width:0}.artifact-name{font-weight:600;font-size:13px;overflow-wrap:anywhere}.artifact-meta{font-size:11px;color:#777;margin-top:2px}.artifact-download{border:1px solid #bbb;border-radius:8px;background:#fff;padding:7px 10px;font:inherit;cursor:pointer}.artifact-audio{grid-column:1/-1;width:100%;height:38px}
    textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #bbb;border-radius:10px;padding:14px;font:inherit;line-height:1.5}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}.primary{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;background:#111;color:#fff}.primary:disabled,.secondary:disabled{opacity:.5;cursor:default}.attach{display:inline-flex;align-items:center;gap:6px;border:1px solid #ccc;border-radius:10px;padding:9px 11px;cursor:pointer;background:#fff}.attach input{display:none}#pending{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}#status{margin-top:10px;font-size:13px;color:#666}.note{font-size:12px;color:#777;margin:10px 0 0;line-height:1.5}.error{color:#a11}.speech-options{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.speech-options input[type=text]{border:1px solid #bbb;border-radius:8px;padding:8px 10px;font:inherit;min-width:250px}.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid #bbb;border-radius:999px;padding:7px 10px;background:#fff;cursor:pointer}.badge{font-size:11px;border:1px solid #ccc;border-radius:999px;padding:4px 7px;background:#fafafa}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Ox Alpha Chat</h1><div class="sub">Response Tool / Ox Alpha response → Fish Audio speech</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="artifactTest" type="button">受け渡しテスト</button><button class="secondary" id="newChat" type="button">新しい会話</button><a class="back" href="/">← Response Tool</a></div>
  </header>
  <div id="health">実行環境を確認中…</div>
  <div id="conversation" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" aria-label="入力" maxlength="100000" placeholder="Ox Alphaへのメッセージを入力。音声応答ON時は、Oxの回答をFish Audioで読み上げます。"></textarea>
    <div id="pending"></div>
    <div class="speech-options">
      <label class="toggle"><input id="speechMode" type="checkbox" /> 🔊 音声応答</label>
      <input id="voice" type="text" maxlength="220" placeholder="Fish Audio voice / reference ID（任意）" />
      <span class="badge">参照音声: request-scoped受け渡し口</span>
    </div>
    <div class="controls">
      <label class="attach">＋ 添付<input id="files" type="file" multiple /></label>
      <button class="primary" id="send" type="submit">送信</button>
    </div>
  </form>
  <div id="status" aria-live="polite"></div>
  <p class="note">音声応答ONでは、まずOx Alphaが通常のテキスト回答を生成し、その回答文だけを <code>fish-audio/s2.1-pro-free:free</code> へ渡してMP3化します。TTSが失敗してもOxのテキスト回答は残ります。参照音声ファイルはResponse Toolが受け取れますが、raw音声は現在OpenRouterへ直接転送しません。</p>
</main>
<script>
const form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),speechMode=document.getElementById('speechMode'),voice=document.getElementById('voice'),status=document.getElementById('status'),conversation=document.getElementById('conversation'),fileInput=document.getElementById('files'),pending=document.getElementById('pending'),newChat=document.getElementById('newChat'),artifactTest=document.getElementById('artifactTest'),health=document.getElementById('health');
const profileId='ox-alpha-default',MAX_FILES=4,MAX_TOTAL=2621440,MAX_REFERENCE_AUDIO=2097152;
speechMode.checked=localStorage.getItem('ox_alpha_speech_mode')==='1';speechMode.addEventListener('change',()=>localStorage.setItem('ox_alpha_speech_mode',speechMode.checked?'1':'0'));
function randomKey(){const bytes=crypto.getRandomValues(new Uint8Array(32));let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
const clientId=localStorage.getItem('ox_alpha_client_id')||('ox_client_'+crypto.randomUUID());localStorage.setItem('ox_alpha_client_id',clientId);
const clientKey=localStorage.getItem('ox_alpha_client_key')||randomKey();localStorage.setItem('ox_alpha_client_key',clientKey);
let sessionId=sessionStorage.getItem('ox_alpha_session_id')||('ox_'+crypto.randomUUID());sessionStorage.setItem('ox_alpha_session_id',sessionId);
let history=[];try{history=JSON.parse(sessionStorage.getItem('ox_alpha_history')||'[]');if(!Array.isArray(history))history=[];}catch{history=[];}
let selected=[];
function leanArtifact(a){return {...a,content:'',data_base64:''};}
function saveHistory(){const turns=history.slice(-60);try{sessionStorage.setItem('ox_alpha_history',JSON.stringify(turns));}catch{sessionStorage.setItem('ox_alpha_history',JSON.stringify(turns.map(turn=>({...turn,artifacts:Array.isArray(turn.artifacts)?turn.artifacts.map(leanArtifact):undefined}))));}}
function humanBytes(bytes){const n=Number(bytes)||0;if(n<1024)return `${n} B`;if(n<1024*1024)return `${Math.ceil(n/1024)} KB`;return `${(n/1024/1024).toFixed(1)} MB`;}
function artifactBlob(artifact){if(typeof artifact?.data_base64==='string'&&artifact.data_base64){const bin=atob(artifact.data_base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:artifact.mime||'application/octet-stream'});}if(typeof artifact?.content==='string'&&artifact.content)return new Blob([artifact.content],{type:artifact.mime||'application/octet-stream'});return null;}
function downloadArtifact(artifact){const blob=artifactBlob(artifact);if(!blob){status.className='error';status.textContent='このArtifact本体はブラウザ内に残っていません。もう一度生成してください。';return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=artifact.filename||'generated.bin';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.className='';status.textContent=`${artifact.filename||'generated.bin'} を受け渡しました。`;}
function audioUrl(artifact){if(typeof artifact?.data_base64!=='string'||!artifact.data_base64)return null;return `data:${artifact.mime||'audio/mpeg'};base64,${artifact.data_base64}`;}
function renderArtifacts(container,artifacts){if(!Array.isArray(artifacts)||!artifacts.length)return;const wrap=document.createElement('div');wrap.className='artifacts';for(const artifact of artifacts){const card=document.createElement('div');card.className='artifact-card';const isAudio=String(artifact.mime||'').startsWith('audio/');const info=document.createElement('div');info.className='artifact-info';const name=document.createElement('div');name.className='artifact-name';name.textContent=(isAudio?'🔊 ':'📄 ')+(artifact.filename||'generated.bin');const meta=document.createElement('div');meta.className='artifact-meta';meta.textContent=[humanBytes(artifact.bytes),artifact.mime||'application/octet-stream',artifact.persistent?'保存済み':'一時受け渡し'].filter(Boolean).join(' / ');info.append(name,meta);const button=document.createElement('button');button.type='button';button.className='artifact-download';button.textContent='ダウンロード';button.disabled=!artifactBlob(artifact);button.onclick=()=>downloadArtifact(artifact);card.append(info,button);if(isAudio){const src=audioUrl(artifact);if(src){const audio=document.createElement('audio');audio.className='artifact-audio';audio.controls=true;audio.preload='metadata';audio.src=src;card.appendChild(audio);}}wrap.appendChild(card);}container.appendChild(wrap);}
function render(){conversation.textContent='';if(!history.length){const d=document.createElement('div');d.className='turn assistant';d.textContent='Ox Alpha専用チャットです。音声応答ONでは、Oxの回答をFish Audioで読み上げます。';conversation.appendChild(d);return;}for(const turn of history){const div=document.createElement('div');div.className='turn '+turn.role;div.append(document.createTextNode((turn.role==='user'?'You: ':'Ox Alpha: ')+(turn.text||'')));if(Array.isArray(turn.attachments)&&turn.attachments.length){const meta=document.createElement('div');meta.className='meta';meta.textContent='添付: '+turn.attachments.join(', ');div.appendChild(meta);}renderArtifacts(div,turn.artifacts);conversation.appendChild(div);}conversation.scrollTop=conversation.scrollHeight;}
function renderPending(){pending.textContent='';for(const [i,file] of selected.entries()){const chip=document.createElement('span');chip.className='file-chip';const audio=file.type.startsWith('audio/');chip.append(document.createTextNode(`${audio?'🔊 ':''}${file.name} (${Math.ceil(file.size/1024)} KB)`));const x=document.createElement('button');x.type='button';x.textContent='×';x.onclick=()=>{selected.splice(i,1);renderPending();};chip.appendChild(x);pending.appendChild(chip);}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(r.error||new Error('file_read_failed'));r.readAsDataURL(file);});}
function validateFiles(list){const next=[...selected,...list];if(next.length>MAX_FILES)throw new Error(`添付は最大${MAX_FILES}件です。`);const total=next.reduce((sum,f)=>sum+f.size,0);if(total>MAX_TOTAL)throw new Error('添付ファイルの合計は2.5 MiB以下にしてください。');for(const f of next){if(f.type.startsWith('audio/')&&f.size>MAX_REFERENCE_AUDIO)throw new Error('参照音声は1件2 MiB以下にしてください。');}return next;}
fileInput.addEventListener('change',()=>{try{selected=validateFiles([...fileInput.files]);renderPending();status.textContent='';status.className='';}catch(e){status.textContent=e.message;status.className='error';}finally{fileInput.value='';}});
async function checkHealth(){try{const r=await fetch('/api/architecture?mode=ox-alpha-health',{cache:'no-store'}),b=await r.json();if(!r.ok||!b.ok)throw new Error(b.error||('HTTP '+r.status));const mem=b.memory?.configured&&b.memory?.schema_ok?'記憶DB: 接続済み':'記憶DB: 未接続',art=b.artifacts?.enabled?'Artifact: 可':'Artifact: 不可',speechState=b.speech?.enabled&&b.speech?.api_key_configured?`Speech: ${b.speech.model}`:'Speech: 未設定',voiceState=b.speech?.voice_source?`voice: ${b.speech.voice_source}`:'',build=b.commit_sha?`build ${String(b.commit_sha).slice(0,7)}`:'';health.className=b.api_key_configured?'health-ok':'health-bad';health.textContent=[`Ox: ${b.model||'-'}`,mem,art,speechState,voiceState,build].filter(Boolean).join(' / ');}catch(e){health.className='health-bad';health.textContent='実行環境の確認に失敗: '+e.message;}}
async function restore(){const token=sessionStorage.getItem('ox_alpha_session_token')||'';if(!token||history.length)return;try{const u='/api/history?'+new URLSearchParams({profile_id:profileId,session_id:sessionId,token,limit:'30'});const r=await fetch(u),b=await r.json();if(!r.ok||!b.ok)return;history=[];for(const t of b.turns||[]){history.push({role:'user',text:t.request_text||t.request||''},{role:'assistant',text:t.response_text||t.response||''});}saveHistory();render();}catch{}}
artifactTest.addEventListener('click',async()=>{artifactTest.disabled=true;status.className='';status.textContent='Artifact受け渡し口を確認中…';try{const r=await fetch('/api/architecture?mode=ox-alpha-artifact-test',{cache:'no-store'}),b=await r.json();if(!r.ok||!b.ok||!b.artifacts?.length)throw new Error(b.error||'artifact_test_failed');history.push({role:'assistant',text:b.text||'Artifact受け渡しテスト',artifacts:b.artifacts});saveHistory();render();status.textContent='Artifact受け渡し口は正常です。';}catch(e){status.className='error';status.textContent='Artifact受け渡しテスト失敗: '+e.message;}finally{artifactTest.disabled=false;}});
newChat.addEventListener('click',()=>{sessionId='ox_'+crypto.randomUUID();sessionStorage.setItem('ox_alpha_session_id',sessionId);sessionStorage.removeItem('ox_alpha_session_token');history=[];selected=[];saveHistory();renderPending();render();status.className='';status.textContent='新しい会話を開始しました。';input.focus();});
function setBusy(flag){send.disabled=flag;newChat.disabled=flag;artifactTest.disabled=flag;speechMode.disabled=flag;}
async function selectedAttachments(){return Promise.all(selected.map(async file=>({name:file.name,type:file.type||'application/octet-stream',data:await fileToDataURL(file)})));}
async function generateSpeechFromOx(text,audioFiles){let reference_audio=null;if(audioFiles[0])reference_audio={name:audioFiles[0].name,type:audioFiles[0].type||'application/octet-stream',data:await fileToDataURL(audioFiles[0])};const payload={input:text,response_format:'mp3',voice:voice.value.trim(),reference_audio};const r=await fetch('/api/architecture?mode=ox-speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.detail||b.error||('HTTP '+r.status));return b;}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text&&!selected.length)return;const audioFiles=selected.filter(f=>f.type.startsWith('audio/'));if(audioFiles.length>1){status.className='error';status.textContent='参照音声は1件だけ選択してください。';return;}setBusy(true);status.className='';status.textContent='Oxへ送信中…';try{const attachments=await selectedAttachments();const payload={request_id:'ox_web_'+Date.now(),request_text:text,session_id:sessionId,session_token:sessionStorage.getItem('ox_alpha_session_token')||'',client_id:clientId,client_key:clientKey,max_output_tokens:6000,attachments:attachments.filter(a=>!String(a.type||'').startsWith('audio/'))};const r=await fetch('/api/architecture?mode=ox-alpha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),b=await r.json().catch(()=>({}));if(!r.ok||!b.ok)throw new Error(b.detail||b.error||('HTTP '+r.status));const assistantTurn={role:'assistant',text:b.text||'',artifacts:Array.isArray(b.artifacts)?b.artifacts:[]};history.push({role:'user',text:text||'添付された内容を確認してください。',attachments:selected.map(f=>f.name)},assistantTurn);saveHistory();render();if(b?.session?.session_token)sessionStorage.setItem('ox_alpha_session_token',b.session.session_token);if(b?.session?.session_id){sessionId=b.session.session_id;sessionStorage.setItem('ox_alpha_session_id',sessionId);}let speechMeta='';if(speechMode.checked&&b.text){status.textContent='Oxの回答をFish Audioで音声化中…';try{const speech=await generateSpeechFromOx(b.text,audioFiles);assistantTurn.artifacts=[...(assistantTurn.artifacts||[]),...(speech.artifacts||[])];speechMeta=` / Speech ${speech.model||'Fish Audio'} ${humanBytes(speech.generation?.audio_bytes)}`;saveHistory();render();}catch(speechError){speechMeta=` / 音声化失敗: ${speechError.message}`;}}input.value='';selected=[];renderPending();status.className=speechMeta.includes('音声化失敗')?'error':'';status.textContent=[b.provider,b.upstream_provider,b.model,`turn ${b?.session?.turn_no||'-'}`,b.artifacts?.length?`Artifact ${b.artifacts.length}件`:null].filter(Boolean).join(' / ')+speechMeta;}catch(err){status.className='error';status.textContent='エラー: '+err.message;}finally{setBusy(false);input.focus();checkHealth();}});
render();checkHealth();restore();
</script>
</body>
</html>
