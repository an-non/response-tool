<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Response Tool</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f6f7f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{font-size:20px;margin:0 0 18px}
    textarea{width:100%;min-height:140px;resize:vertical;border:1px solid #bbb;border-radius:10px;padding:14px;font:inherit;line-height:1.5}
    button{margin-top:12px;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:#111;color:#fff}
    button:disabled{opacity:.5;cursor:default}
    #response{margin-top:22px;min-height:100px;white-space:pre-wrap;border-top:1px solid #eee;padding-top:18px;line-height:1.6}
    #status{margin-top:10px;font-size:13px;color:#666}
  </style>
</head>
<body>
  <main>
    <h1>Response Tool</h1>
    <form id="form">
      <textarea id="input" aria-label="入力" placeholder="メッセージを入力" required></textarea>
      <button id="send" type="submit">送信</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <div id="response" aria-live="polite"></div>
  </main>
<script>
const form=document.getElementById('form');
const input=document.getElementById('input');
const send=document.getElementById('send');
const status=document.getElementById('status');
const response=document.getElementById('response');

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const request_text=input.value;
  if(!request_text.trim())return;
  send.disabled=true; status.textContent='送信中…'; response.textContent='';
  const id='web_'+Date.now();
  const payload={
    schema_version:'1.3',request_id:id,request_text,
    yuki_state:{intent:'affirmative',consent:'affirmative_revocable',initiative:'neutral',affection:'neutral',arousal_context:'none',plain_language:''},
    yuki_context:{profile_id:'response-tool-web',persona:{autonomy:'independent'},consent_profile:{revocable:true,current_permissions:[]},relationship:{established:false,mode:null}},
    state_transition:{action:'preserve',reason:'web_app'},
    rendering:{language:'ja',max_output_tokens:500,output_format:'text'}
  };
  try{
    const r=await fetch('/api/relay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const b=await r.json();
    if(!r.ok||!b.ok)throw new Error(b.error||('HTTP '+r.status));
    response.textContent=b.text||'';
    status.textContent='';
  }catch(err){
    status.textContent='エラー: '+err.message;
  }finally{send.disabled=false;}
});
</script>
</body>
</html>
