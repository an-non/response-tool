<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Response Tool</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f6f7f8}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{font-size:20px;margin:0 0 18px} #conversation{display:grid;gap:12px;margin-bottom:18px;max-height:52vh;overflow:auto}
    .turn{white-space:pre-wrap;line-height:1.6;padding:12px 14px;border-radius:10px;background:#f5f5f5}.assistant{background:#eef1f4}
    textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #bbb;border-radius:10px;padding:14px;font:inherit;line-height:1.5}
    button{margin-top:12px;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:#111;color:#fff}button:disabled{opacity:.5;cursor:default}
    #status{margin-top:10px;font-size:13px;color:#666}
  </style>
</head>
<body>
<main>
  <h1>Response Tool</h1>
  <div id="conversation" aria-live="polite"></div>
  <form id="form"><textarea id="input" aria-label="入力" placeholder="メッセージを入力" required></textarea><button id="send" type="submit">送信</button></form>
  <div id="status" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status'),conversation=document.getElementById('conversation');
const profileId='yuki-default';
function randomKey(){const bytes=crypto.getRandomValues(new Uint8Array(32));let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
const clientId=localStorage.getItem('yuki_client_id')||('client_'+crypto.randomUUID());localStorage.setItem('yuki_client_id',clientId);
const clientKey=localStorage.getItem('yuki_client_key')||randomKey();localStorage.setItem('yuki_client_key',clientKey);
let sessionId=sessionStorage.getItem('yuki_session_id')||('sess_'+crypto.randomUUID());
let history=[];try{history=JSON.parse(sessionStorage.getItem('yuki_history')||'[]');if(!Array.isArray(history))history=[];}catch{history=[];}
function saveHistory(){sessionStorage.setItem('yuki_history',JSON.stringify(history.slice(-40)));}
function render(){conversation.textContent='';for(const turn of history){const div=document.createElement('div');div.className='turn '+turn.role;div.textContent=(turn.role==='user'?'You: ':'Yuki: ')+turn.text;conversation.appendChild(div);}conversation.scrollTop=conversation.scrollHeight;}
function encodePayload(value){const bytes=new TextEncoder().encode(JSON.stringify(value));let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function recentPairs(){const pairs=[];for(let i=Math.max(0,history.length-4);i<history.length;i+=2){const u=history[i],a=history[i+1];if(u?.role==='user'&&a?.role==='assistant')pairs.push({request:u.text,response:a.text});}return pairs.slice(-2);}
async function resumeFromBlob(){
  try{
    const u='/api/history?'+new URLSearchParams({profile_id:profileId,client_id:clientId,client_key:clientKey,limit:'30'});
    const r=await fetch(u),b=await r.json();
    if(r.status===404){sessionStorage.setItem('yuki_session_id',sessionId);return;}
    if(!r.ok||!b.ok)throw new Error(b.error||('HTTP '+r.status));
    sessionId=b.session_id;sessionStorage.setItem('yuki_session_id',sessionId);
    if(b.session_token)sessionStorage.setItem('yuki_session_token',b.session_token);
    history=[];for(const t of b.turns||[])history.push({role:'user',text:t.request_text},{role:'assistant',text:t.response_text});saveHistory();render();status.textContent=history.length?'前回の会話を復元しました':'';
  }catch{sessionStorage.setItem('yuki_session_id',sessionId);}
}
render();resumeFromBlob();
form.addEventListener('submit',async(e)=>{
  e.preventDefault();const current=input.value;if(!current.trim())return;send.disabled=true;status.textContent='送信中…';
  const payload={schema_version:'1.3',request_id:'web_'+Date.now(),request_text:current,session_id:sessionId,session_token:sessionStorage.getItem('yuki_session_token')||'',client_id:clientId,client_key:clientKey,client_recent_turns:recentPairs(),yuki_state:{intent:'affirmative',consent:'affirmative_revocable',initiative:'neutral',affection:'neutral',arousal_context:'none',plain_language:''},yuki_context:{profile_id:profileId,session_id:sessionId,persona:{autonomy:'independent'},consent_profile:{revocable:true,current_permissions:[]},relationship:{established:false,mode:null}},state_transition:{action:'preserve',reason:'web_app'},rendering:{language:'ja',max_output_tokens:1800,output_format:'text'}};
  try{
    const p=encodePayload(payload),r=await fetch('/api/relay?p='+encodeURIComponent(p),{method:'GET'}),b=await r.json();
    if(!r.ok||!b.ok){
      if(r.status===429||b.error==='groq_rate_limit'){
        const sec=Number(b.retry_after_seconds);
        status.textContent=Number.isFinite(sec)&&sec>0?`Groqのレート上限です。約${sec}秒後にもう一度送信してください。`:'Groqのレート上限です。少ししてからもう一度送信してください。';
        return;
      }
      throw new Error(b.error||('HTTP '+r.status));
    }
    history.push({role:'user',text:current},{role:'assistant',text:b.text||''});saveHistory();render();input.value='';sessionStorage.setItem('yuki_session_id',sessionId);if(b?.memory?.session_token)sessionStorage.setItem('yuki_session_token',b.memory.session_token);status.textContent=b?.memory?.blob_configured?'':'Blobメモリ未接続: このタブ内の直近会話で継続中';
  }
  catch(err){status.textContent='エラー: '+err.message;}finally{send.disabled=false;input.focus();}
});
</script>
</body>
</html>
